<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecipeShare Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-utensils"></i>
                <span>RecipeShare</span>
            </div>

            <div class="menu">

                <a href="dashboard.html" class="active">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>

                <a href="my-recipes.html">
                    <i class="fa-solid fa-book-open"></i>
                    <span>My Recipes</span>
                </a>

                <a href="add-recipe.html">
                    <i class="fa-solid fa-circle-plus"></i>
                    <span>Add Recipe</span>
                </a>

                <a href="all-recipes.html">
                    <i class="fa-solid fa-table-cells-large"></i>
                    <span>All Recipes</span>
                </a>

                <a href="profile.html">
                    <i class="fa-solid fa-circle-user"></i>
                    <span>Profile</span>
                </a>

                <a href="#" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>

            </div>

        </aside>


        <!-- Main Content -->
        <main class="main">

            <!-- Top Navbar -->
            <div class="topbar">

                <div class="user">

                    <i class="fa-solid fa-circle-user"></i>

                    <span id="userName">Naima</span>

                    <i class="fa-solid fa-angle-down arrow"></i>

                </div>

            </div>


            <!-- Dashboard Content -->
            <section class="content">

                <!-- Welcome -->
                <div class="welcome">

                    <h2>
                        Welcome, <span id="welcomeName">Naima</span>!
                    </h2>

                    <p>
                        Here's what's happening with your recipes.
                    </p>

                </div>


                <!-- Statistics Cards -->
                <div class="row">

                    <!-- My Recipes -->
                    <div class="col-md-6">

                        <div class="stat-card orange">

                            <div class="icon-box">
                                <i class="fa-solid fa-book-open"></i>
                            </div>

                            <h6>My Recipes</h6>

                            <h3 id="myRecipes">3</h3>

                        </div>

                    </div>


                    <!-- Total Recipes -->
                    <div class="col-md-6">

                        <div class="stat-card green">

                            <div class="icon-box">
                                <i class="fa-solid fa-bowl-food"></i>
                            </div>

                            <h6>Total Recipes</h6>

                            <h3 id="totalRecipes">8</h3>

                        </div>

                    </div>


                    <!-- Categories -->
                    <div class="col-md-6">

                        <div class="stat-card purple">

                            <div class="icon-box">
                                <i class="fa-solid fa-layer-group"></i>
                            </div>

                            <h6>Categories</h6>

                            <h3 id="categories">5</h3>

                        </div>

                    </div>


                    <!-- Followers -->
                    <div class="col-md-6">

                        <div class="stat-card red">

                            <div class="icon-box">
                                <i class="fa-solid fa-user-group"></i>
                            </div>

                            <h6>Followers</h6>

                            <h3 id="followers">0</h3>

                        </div>

                    </div>

                </div>


                <!-- Recent Recipes -->
                <div class="recent-box">

                    <div class="recent-heading">

                        <h4>Recent Recipes</h4>

                        <a href="all-recipes.html" class="view-all">
                            View All →
                        </a>

                    </div>


                    <!-- Recipe -->
                    <div class="recipe">

                        <img
                            src="https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=300&q=80"
                            alt="Chicken Pasta">

                        <div class="recipe-info">

                            <h6>Chicken Pasta</h6>

                            <p>Dinner</p>

                            <small>Sep 18, 2025</small>

                        </div>


                        <button class="btn-edit"
                            onclick="editRecipe()">
                            Edit
                        </button>

                        <button class="btn-delete"
                            onclick="deleteRecipe()">
                            Delete
                        </button>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>



    <!-- supabase link -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>



<script src="app.js"></script>
</body>
</html>
