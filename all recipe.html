<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
</head>
<body>
    

<!-- NAVBAR -->
<nav class="navbar">

    <div class="logo">
        🍴 Recipe<span>Share</span>
    </div>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="index.html" class="logout-btn">
            Logout
        </a>

    </div>

</nav>


<!-- ADD RECIPE PAGE -->

<main class="add-recipe-page">

    <div class="add-recipe-header">

        <div>
            <a href="dashboard.html" class="back-link">
                ← Back to Dashboard
            </a>

            <h1>Add New Recipe</h1>

            <p>
                Share your favorite recipe with the RecipeShare community.
            </p>
        </div>

    </div>


    <div class="recipe-form-card">

        <form id="recipefrom">

            <!-- IMAGE UPLOAD -->

            <div class="recipe-image-upload">

                <div class="upload-icon">
                    📷
                </div>

                <h3>Recipe Image</h3>

                <p>
                    Upload a beautiful image of your dish
                </p>

                <label for="recipeImage" class="upload-btn">
                    Choose Image
                </label>

                <input
                    type="file"
                    id="recipeImage"
                    accept="image/*"
                >

                <small>
                    JPG, PNG or WEBP • Max 5MB
                </small>

            </div>


            <!-- BASIC INFORMATION -->

            <div class="form-section">

                <div class="form-section-title">
                    <span>🍽️</span>

                    <div>
                        <h2>Recipe Information</h2>

                        <p>
                            Tell us about your delicious recipe.
                        </p>
                    </div>
                </div>


                <div class="form-grid">

                    <!-- RECIPE NAME -->

                    <div class="form-group full-width">

                        <label for="recipeName">
                            Recipe Name
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="recipeName"
                            placeholder="e.g. Creamy Chicken Pasta"
                            name="recipename"
                        >

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category
                            <span>*</span>
                        </label>

                        <select id="category" name="category">

                            <option value="">
                                Select Category
                            </option>

                            <option value=" Pakistani">
                                Pakistani
                            </option>

                            <option value="Fast Food">
                                Fast Food
                            </option>

                            <option value=" Italian">
                                Italian
                            </option>

                            <option value="Chinese">
                                Chinese
                            </option>

                            <option value=" Desserts">
                                Desserts
                            </option>

                            <option value="Breakfast">
                                Breakfast
                            </option>

                            <option value=" Drinks">
                                Drinks
                            </option>

                            <option value=" Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- COOKING TIME -->

                    <div class="form-group">

                        <label for="cookingTime">
                            Cooking Time
                            <span>*</span>
                        </label>

                        <select id="cookingTime" name="cookingTime">

                            <option value="">
                                Select Time
                            </option>

                            <option value="Under 15 minutes">
                                Under 15 minutes
                            </option>

                            <option value="15 - 30 minutes">
                                15 - 30 minutes
                            </option>

                            <option value="    30 - 60 minutes">
                                30 - 60 minutes
                            </option>

                            <option value="   1 - 2 hours">
                                1 - 2 hours
                            </option>

                            <option value=" 2+ hours">
                                2+ hours
                            </option>

                        </select>

                    </div>




                    <!-- DESCRIPTION -->

                    <div class="form-group full-width">

                        <label for="description">
                            Description
                            <span>*</span>
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="5"
                            placeholder="Describe your recipe, its taste, special ingredients or anything you'd like people to know..."
                        ></textarea>

                    </div>

                </div>

            </div>


                     

            <!-- BUTTONS -->

            <div class="form-actions">
                <button
                    type="submit"
                    class="save-recipe-btn"
                >
                    🍳 Publish Recipe
                </button>

            </div>

        </form>

    </div>

</main>







    
    <!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SWEET ALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- APP JS -->
    <script src="./app.js"></script>
</body>
</html>
