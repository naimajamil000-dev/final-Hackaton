<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <!-- ==================== NAVBAR ==================== -->

    <nav class="navbar navbar-expand-lg bg-body" id="navbar">
      <div class="container-fluid">
        <a
          class="navbar-brand d-flex align-items-center fw-bold"
          href="../index.html"
        >
          <img
            src="./images/nav logo.png"
            alt="Logo"
            width="60"
            height="54"
             class="d-inline-block align-text-top"
          />
          Recipie<span class="text-warning">sharing
          </span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <div class="text-center ms-auto">
            <a
              href="../index.html"
              class="text-black bg-warning p-2 rounded-2 text-decoration-none"
              >Back to Home</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- ==================== LOGIN CARD ==================== -->

    <div
      class="container-fluid pt-5 d-flex align-items-center justify-content-center"
    >
      <div
        class="row shadow rounded-4 overflow-hidden bg-white w-100"
        style="max-width: 1000px"
      >
        <!-- Login Form -->
        <div class="col-md-6 p-5">
          <div class="mb-4">
            <h3 class="fw-bold text-warning">Recipie sharing</h3>
          </div>

          <h1 class="fw-bold mb-2">Welcome Back!</h1>

          <p class="text-secondary mb-4">Login to your account</p>

          <form id="studentLogin">
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">
                Email Address
              </label>

              <input
                type="email"
                id="email"
                class="form-control form-control-lg"
                placeholder="Enter your email"
              />
            </div>

            <!-- Password -->
            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label for="password" class="form-label fw-semibold">
                  Password
                </label>
              </div>

              <input
                type="password"
                id="password"
                class="form-control form-control-lg"
                placeholder="Enter your password"
              />
            </div>

            <!-- Login Button -->
            <button
              type="submit"
              class="btn btn-warning btn-lg w-100 fw-semibold text-white"
            >
              Login
            </button>
          </form>

          <p class="text-center text-secondary mt-4">
            Don't have an account?

            <a
              href="signup.html"
              class="text-primary fw-semibold text-decoration-underline"
            >
              Create Account
            </a>
          </p>
        </div>

        <!-- Image -->
        <div
          class="col-md-6 p-3 bg-warning-subtle d-none d-md-flex align-items-center"
        >
          <img
            src="./images/login.png"
            alt="Login Illustration"
            class="img-fluid rounded-4 w-100"
          />
        </div>
      </div>
    </div>
<!-- supabase link -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="app.js"></script>
</body>
</html>
